#  KonamikU — generate update.json + per-tag changelogs (linked list)
#  Branch: info — files live at root, pushed via orphan branch.
name: Update Changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag (leave empty to use HEAD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve versions
        id: versions
        run: |
          TAG_INPUT="${{ github.event.inputs.tag }}"
          if [ -n "$TAG_INPUT" ]; then TAG="$TAG_INPUT"
          elif [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then TAG="${GITHUB_REF#refs/tags/}"
          else TAG=$(git tag --sort=-creatordate | head -1); fi

          if [ -z "$TAG" ] || [ "$TAG" = "HEAD" ]; then
            echo "::error::No tag resolved. Pass a tag via workflow_dispatch input."
            exit 1
          fi

          # version_code must be a positive integer — build.gradle.kts derives it
          # as yyMM*10000 + major*100 + minor, and clients compare it numerically.
          if ! [[ "$TAG" =~ ^[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not numeric; clients cannot compare it as version_code. Aborting."
            exit 1
          fi

          echo "version_code=$TAG" >> "$GITHUB_OUTPUT"
          echo "current_tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      # The feed may only point at an APK that existing installs can take:
      # same package and signer, versionCode equal to the tag, and above every
      # earlier release. Anything else stops here, before update info exists.
      - name: Verify release APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versions.outputs.current_tag }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          PACKAGE="org.cf0x.konamiku"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          SIGNER_RE='^Signer #[0-9]+ certificate SHA-256 digest:'
          FAIL=0

          if ! curl -fsSL --retry 2 --max-time 300 -o /tmp/release.apk \
               "https://github.com/${REPO}/releases/download/${TAG}/app-release.apk"; then
            echo "::error::Cannot download app-release.apk of release $TAG"
            exit 1
          fi

          # 1. Package and versionCode come from the APK itself, not the tag.
          BADGING=$("$BT/aapt2" dump badging /tmp/release.apk | head -n 1)
          APK_PACKAGE=$(grep -oP "^package: name='\K[^']+" <<<"$BADGING" || true)
          APK_CODE=$(grep -oP " versionCode='\K[0-9]+" <<<"$BADGING" || true)
          echo "APK: package=$APK_PACKAGE versionCode=$APK_CODE"
          if [ "$APK_PACKAGE" != "$PACKAGE" ]; then
            echo "::error::APK package '$APK_PACKAGE' is not $PACKAGE"
            FAIL=1
          fi
          if [ "$APK_CODE" != "$TAG" ]; then
            echo "::error::APK versionCode '$APK_CODE' does not equal tag '$TAG'"
            FAIL=1
          fi

          # 2. Above every other released version. Each release tag equals its
          #    APK versionCode (enforced above), so the tags stand in for them;
          #    re-running an old tag fails here instead of moving the feed back.
          if ! RELEASE_TAGS=$(gh api --paginate "repos/${REPO}/releases" \
                                --jq '.[] | select(.draft | not) | .tag_name'); then
            echo "::error::Cannot list releases of ${REPO}"
            exit 1
          fi
          PREV_MAX=$(grep -E '^[0-9]+$' <<<"$RELEASE_TAGS" | grep -vxF "$TAG" | sort -n | tail -n 1)
          if [ -n "$PREV_MAX" ] && [ "$TAG" -le "$PREV_MAX" ]; then
            echo "::error::Tag $TAG is not above the highest released version $PREV_MAX"
            FAIL=1
          fi

          # 3. A valid signature, from the same signer as the APK the live feed
          #    points at, and never a version below that feed.
          NEW_SIGNERS=$("$BT/apksigner" verify --print-certs /tmp/release.apk | grep -E "$SIGNER_RE" | sort)
          if [ -z "$NEW_SIGNERS" ]; then
            echo "::error::APK signature does not verify"
            FAIL=1
          fi
          # Exit code 2 means the branch does not exist yet; any other failure
          # must not silently skip the comparison.
          RC=0
          git ls-remote --exit-code --heads origin info >/dev/null || RC=$?
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then
            echo "::error::Cannot query the info branch (git ls-remote exit $RC)"
            exit 1
          fi
          if [ "$RC" -eq 0 ]; then
            git fetch --quiet origin info
            FEED=$(git show FETCH_HEAD:update.json)
            FEED_CODE=$(jq -r '.version_code' <<<"$FEED")
            FEED_URL=$(jq -r '.download_url' <<<"$FEED")
            if ! [[ "$FEED_CODE" =~ ^[0-9]+$ ]]; then
              echo "::error::Live feed version_code '$FEED_CODE' is not numeric"
              FAIL=1
            elif [ "$TAG" -lt "$FEED_CODE" ]; then
              echo "::error::Tag $TAG is below the live feed version $FEED_CODE"
              FAIL=1
            fi
            if curl -fsSL --retry 2 --max-time 300 -o /tmp/feed.apk "$FEED_URL"; then
              OLD_SIGNERS=$("$BT/apksigner" verify --print-certs /tmp/feed.apk | grep -E "$SIGNER_RE" | sort)
              if [ -z "$OLD_SIGNERS" ] || [ "$OLD_SIGNERS" != "$NEW_SIGNERS" ]; then
                echo "::error::APK signer differs from the live feed APK ($FEED_URL)"
                FAIL=1
              fi
            else
              echo "::error::Cannot download the live feed APK ($FEED_URL) to compare signers"
              FAIL=1
            fi
          else
            echo "::notice::No live feed on the info branch; skipping feed and signer comparison"
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Release APK rejected — info branch NOT updated."
            exit 1
          fi
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"

      - name: Generate per-tag changelogs
        run: |
          mkdir -p /tmp/_info
          REPO="${GITHUB_REPOSITORY}"
          BASE="https://raw.githubusercontent.com/${REPO}/info"
          # Only numeric tags take part in the changelog chain; anything else
          # would become a dead node users can page into.
          TAGS=$(git for-each-ref --sort=committerdate refs/tags --format='%(refname:short)' \
                 | grep -E '^[0-9]+$' || true)

          if [ -z "$TAGS" ]; then
            echo "::error::No numeric tags found — refusing to publish an empty changelog chain."
            exit 1
          fi

          PREV=""
          for TAG in $TAGS; do
            if [ -z "$PREV" ]; then
              RANGE="$TAG"
              echo "--- Changelog for $TAG (initial) ---"
            else
              RANGE="${PREV}..${TAG}"
              echo "--- Changelog for $TAG (since $PREV) ---"
              PREV_NEXT="${BASE}/changelog-${TAG}.json"
              jq ".next_changelog = \"${PREV_NEXT}\"" "/tmp/_info/changelog-${PREV}.json" > "/tmp/_info/changelog-${PREV}.tmp" || {
                echo "::error::Failed to back-link next_changelog for $PREV -> $TAG"
                exit 1
              }
              mv "/tmp/_info/changelog-${PREV}.tmp" "/tmp/_info/changelog-${PREV}.json"
            fi

            # NUL-delimited commit extraction
            git log "$RANGE" --reverse --format='%H%x00%s%x00%b%x00' 2>/dev/null > "/tmp/raw_${TAG}.txt"
            jq -Rs '
              [split("\u0000") | .[0:-1] | _nwise(3) | {hash: .[0], title: .[1], body: .[2]}]
            ' "/tmp/raw_${TAG}.txt" > "/tmp/commits_${TAG}.json"

            COUNT=$(jq length "/tmp/commits_${TAG}.json")
            echo "  $COUNT commit(s)"

            PREV_LINK=""
            [ -n "$PREV" ] && PREV_LINK="${BASE}/changelog-${PREV}.json"

            jq -n \
              --arg vn "$TAG" \
              --arg dt "$(git log -1 --format=%aI "$TAG" | cut -dT -f1)" \
              --arg prev "$PREV_LINK" \
              --argjson commits "$(cat "/tmp/commits_${TAG}.json")" \
              '{
                version_name: $vn,
                date: $dt,
                previous_changelog: (if $prev == "" then null else $prev end),
                next_changelog: null,
                commits: $commits
              }' > "/tmp/_info/changelog-${TAG}.json"

            PREV="$TAG"
          done
          echo "Done generating per-tag changelogs."

      - name: Write update.json
        run: |
          TAG="${{ steps.versions.outputs.current_tag }}"
          REPO="${GITHUB_REPOSITORY}"
          jq -n \
            --arg tag "$TAG" \
            --arg repo "${REPO}" \
            '{
              version_code: ($tag | tonumber),
              version_name: $tag,
              download_url: "https://github.com/\($repo)/releases/download/\($tag)/app-release.apk",
              changelog_url: "https://raw.githubusercontent.com/\($repo)/info/changelog-\($tag).json",
              latest_changelog: "https://raw.githubusercontent.com/\($repo)/info/changelog-\($tag).json"
            }' > /tmp/_info/update.json
          echo "Generated update.json:"
          cat /tmp/_info/update.json

      - name: Verify generated artifacts
        run: |
          TAG="${{ steps.versions.outputs.current_tag }}"
          FAIL=0

          # 1. Required fields present and version_code is a positive number.
          for f in version_code version_name download_url changelog_url latest_changelog; do
            v=$(jq -r --arg k "$f" '.[$k] // empty' /tmp/_info/update.json)
            if [ -z "$v" ]; then
              echo "::error::update.json is missing field '$f'"
              FAIL=1
            fi
          done
          CODE=$(jq -r '.version_code' /tmp/_info/update.json)
          if ! [[ "$CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::update.json version_code '$CODE' is not a positive integer"
            FAIL=1
          fi

          # 2. The referenced changelog must exist in the generated set.
          if [ ! -f "/tmp/_info/changelog-${TAG}.json" ]; then
            echo "::error::changelog-${TAG}.json was not generated"
            FAIL=1
          fi

          # 3. The APK must actually be downloadable (asset name drift is silent otherwise).
          DL=$(jq -r '.download_url' /tmp/_info/update.json)
          if ! curl -fsIL --retry 2 --max-time 30 -o /dev/null "$DL"; then
            echo "::error::download_url is not reachable: $DL"
            echo "::error::Check that the release asset is named exactly 'app-release.apk'."
            FAIL=1
          fi

          # 4. Every chain link must point at a file we generated.
          for f in /tmp/_info/changelog-*.json; do
            for dir in previous_changelog next_changelog; do
              link=$(jq -r --arg k "$dir" '.[$k] // empty' "$f")
              [ -z "$link" ] && continue
              base=$(basename "$link")
              if [ ! -f "/tmp/_info/$base" ]; then
                echo "::error::$(basename "$f") -> $dir points at missing $base"
                FAIL=1
              fi
            done
          done

          # 5. The feed must describe exactly the APK verified above.
          if [ "$CODE" != "${{ steps.apk.outputs.version_code }}" ]; then
            echo "::error::update.json version_code $CODE differs from the APK versionCode"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Artifact verification failed — info branch NOT updated."
            exit 1
          fi
          echo "All artifacts verified."

      - name: Push to info branch
        run: |
          TAG="${{ steps.versions.outputs.current_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan _info_branch
          git reset --hard
          cp -r /tmp/_info/* .
          rm -f .gitignore

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-generate update info for ${TAG}"
            git push origin _info_branch:info --force
          else
            echo "No changes, skipping commit"
          fi

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Update info"
            if [ -f /tmp/_info/update.json ]; then
              echo '```json'
              cat /tmp/_info/update.json
              echo '```'
              echo ""
              echo "Changelog files generated: $(ls /tmp/_info/changelog-*.json 2>/dev/null | wc -l)"
            else
              echo "**update.json was not generated** — see logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
